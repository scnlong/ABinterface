[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ABinterface"
version = "0.1.0"
description = "Toy density-matrix model for laser-driven A/B interface spin and carrier redistribution"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Generated model refactor"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.scripts]
ABinterface-run = "ABinterface.cli:main"
ABinterface-gui = "ABinterface.gui:main"

[tool.setuptools.packages.find]
where = ["."]
